<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | JBE Academy</title>
<link rel="stylesheet" href="portal.css?v=280">
<link rel="stylesheet" href="bilingual.css?v=280">
<link rel="stylesheet" href="register-v28.css?v=280">
</head>
<body>
<header class="portal-top">
  <a class="brand" href="index.html">JBE <b>Academy</b></a>
  <a class="btn light" href="index.html" data-ar="العودة إلى الموقع" data-en="Back to website">العودة إلى الموقع</a>
  <button class="jbe-language-switch" data-lang-switch type="button">English</button>
</header>

<main class="wrap reg28-wrap">
<section class="hero-card">
  <span class="eyebrow">ONLINE REGISTRATION</span>
  <h1 data-ar="سجّل مرة واحدة، ونحن نكمل من هنا." data-en="Register once. We continue from here.">سجّل مرة واحدة، ونحن نكمل من هنا.</h1>
  <p data-ar="اختر المسار الدراسي خطوة بخطوة، ثم أرسل بيانات التواصل. تنتقل البيانات مباشرة إلى فريق القبول دون إعادة إدخالها."
     data-en="Choose the academic pathway step by step, then send your contact details. Your information goes directly to Admissions without re-entry.">
    اختر المسار الدراسي خطوة بخطوة، ثم أرسل بيانات التواصل. تنتقل البيانات مباشرة إلى فريق القبول دون إعادة إدخالها.
  </p>
</section>

<section class="panel">
<form id="registrationForm">
  <h2 data-ar="1. المسار الدراسي" data-en="1. Academic pathway">1. المسار الدراسي</h2>
  <div class="reg28-path">
    <label><span data-ar="نظام التعليم" data-en="Education system">نظام التعليم</span><select id="system" required></select></label>
    <label id="pathwayWrap"><span data-ar="المسار / المنهج" data-en="Pathway / curriculum">المسار / المنهج</span><select id="pathway" required></select></label>
    <label id="stageWrap"><span data-ar="المرحلة" data-en="Stage">المرحلة</span><select id="stage" required></select></label>
    <label id="gradeWrap"><span data-ar="الصف / السنة" data-en="Grade / year">الصف / السنة</span><select id="grade" required></select></label>
    <label id="subjectWrap"><span data-ar="المادة" data-en="Subject">المادة</span><select id="subject" required></select></label>
  </div>

  <h2 data-ar="2. المعلم أو الكورس" data-en="2. Teacher or course">2. المعلم أو الكورس</h2>
  <div class="form-grid">
    <label><span data-ar="المعلم المفضل" data-en="Preferred teacher">المعلم المفضل</span><select id="teacher"><option value="">لا يوجد تفضيل</option></select></label>
    <label><span data-ar="الكورس المفضل" data-en="Preferred course">الكورس المفضل</span><select id="preferredCourse"><option value="">لا يوجد تفضيل</option></select></label>
  </div>

  <h2 data-ar="3. بيانات التواصل" data-en="3. Contact details">3. بيانات التواصل</h2>
  <div class="form-grid">
    <label><span data-ar="اسم الطالب" data-en="Student name">اسم الطالب</span><input name="student_name" required></label>
    <label><span data-ar="اسم الطالب بالإنجليزية" data-en="Student name in English">اسم الطالب بالإنجليزية</span><input name="student_name_en"></label>
    <label><span data-ar="هاتف الطالب" data-en="Student phone">هاتف الطالب</span><input name="student_phone"></label>
    <label><span data-ar="بريد الطالب" data-en="Student email">بريد الطالب</span><input name="student_email" type="email"></label>
    <label><span data-ar="اسم ولي الأمر" data-en="Guardian name">اسم ولي الأمر</span><input name="guardian_name"></label>
    <label><span data-ar="هاتف ولي الأمر" data-en="Guardian phone">هاتف ولي الأمر</span><input name="guardian_phone"></label>
    <label><span data-ar="بريد ولي الأمر" data-en="Guardian email">بريد ولي الأمر</span><input name="guardian_email" type="email"></label>
    <label><span data-ar="صلة القرابة" data-en="Relationship">صلة القرابة</span>
      <select name="relationship"><option value="father" data-ar="الأب" data-en="Father">الأب</option><option value="mother" data-ar="الأم" data-en="Mother">الأم</option><option value="guardian" data-ar="ولي الأمر" data-en="Guardian">ولي الأمر</option></select>
    </label>
  </div>

  <label><span data-ar="هل توجد ملاحظات نحتاج معرفتها؟" data-en="Anything we should know?">هل توجد ملاحظات نحتاج معرفتها؟</span><textarea name="notes"></textarea></label>
  <button class="gold" type="submit" data-ar="إرسال طلب التسجيل" data-en="Submit Registration">إرسال طلب التسجيل</button>
  <p id="message"></p>
</form>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=280"></script>
<script src="page-i18n.js?v=280"></script>
<script src="supabase-config.js?v=280"></script>
<script src="portal.js?v=280"></script>
<script src="register-v28.js?v=280"></script>
</body>
</html>
