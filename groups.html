<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groups & Scheduling | JBE Academy</title>
<link rel="stylesheet" href="ops.css?v=250"><link rel="stylesheet" href="bilingual.css?v=250">
</head>
<body>
<header class="ops-top">
  <a class="ops-brand" href="index.html">JBE <b>Academy</b></a>
  <div class="ops-actions">
    <a class="ops-btn light" href="portal.html">Portal</a>
    <button class="jbe-language-switch" data-lang-switch type="button">English</button>
    <button class="ops-btn light" onclick="JBE.logout()">Sign out</button>
  </div>
</header>
<main class="ops-shell">
<section class="ops-hero"><span class="ops-eyebrow">ACADEMIC OPERATIONS</span><h1>Groups & Scheduling</h1><p>Create teaching groups and generate recurring sessions without duplicating dates.</p></section>

<section class="ops-panel"><div class="ops-panel-head"><h2>Group Management</h2><button id="openCreate" class="ops-btn gold">Create Group</button></div><div id="groupList" class="ops-list"></div></section>
<div id="groupModal" class="ops-modal hidden"><div class="ops-modal-card"><div class="ops-modal-head"><h2>Create Group</h2><button id="closeGroup" class="ops-btn light">×</button></div>
<form id="groupForm">
<div class="ops-form-grid"><label>Course<select id="gCourse" required></select><label>Teacher<select id="gTeacher"></select></label>
<label>Group name<input id="gName" required></label><label>Capacity<input id="gCapacity" type="number" min="1" value="12"></label>
<label>Weekday<select id="gWeekday"><option value="0">Sunday</option><option value="1">Monday</option><option value="2">Tuesday</option><option value="3">Wednesday</option><option value="4">Thursday</option><option value="5">Friday</option><option value="6">Saturday</option></select></label>
<label>Start time<input id="gTime" type="time" required></label><label>Duration minutes<input id="gDuration" type="number" min="15" step="5" value="60"></label><label>Timezone<input id="gTimezone" value="Africa/Cairo"></label></div>
<button class="ops-btn gold" type="submit">Create Group</button><p id="gMsg"></p></form></div></div>

<p id="pageMsg"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=250"></script><script src="supabase-config.js?v=250"></script><script src="portal.js?v=250"></script>
<script src="groups.js?v=250"></script>
</body></html>
