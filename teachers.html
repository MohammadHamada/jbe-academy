<!DOCTYPE html>

<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Teachers | JBE Academy</title>
<link href="portal.css" rel="stylesheet"/>
<link href="bilingual.css?v=241" rel="stylesheet"/></head>
<body>
<header class="portal-top">
<a class="brand" href="index.html">JBE <b>Academy</b></a>
<div class="actions">
<a class="btn light" href="register.html">Register</a>
<a class="btn" href="student-login.html">Portal Login</a>
<button class="jbe-language-switch" data-lang-switch="" type="button">English</button></div>
</header>
<main class="wrap">
<section class="hero-card">
<span class="eyebrow">JBE TEACHERS</span>
<h1>Learn with the right teacher</h1>
<p>Verified teachers, clear teaching scopes and approved course options.</p>
</section>
<div class="cards" id="teachers"></div>
<p id="msg"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=241"></script><script src="supabase-config.js?v=241"></script>
<script src="portal.js?v=241"></script>
<script>
(async () => {
  const { data, error } = await JBE.client.rpc("public_teacher_directory");

  if (error) {
    document.getElementById("msg").textContent = error.message;
    return;
  }

  const rows = data || [];

  document.getElementById("teachers").innerHTML =
    rows.length
      ? rows.map(t => `
          <article class="card">
            ${t.photo_url
              ? `<img src="${t.photo_url}" alt="${t.display_name}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px">`
              : ""
            }
            <h2>${t.display_name}</h2>
            <p>${t.headline_en || ""}</p>
            <p class="muted">${t.bio_en || ""}</p>
            <a class="btn" href="teacher-profile.html?slug=${encodeURIComponent(t.slug)}">
              View Profile
            </a>
          </article>
        `).join("")
      : `<p class="muted">Teacher profiles will appear here after approval.</p>`;
})();
</script>
</body>
</html>
