<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Affairs | JBE Academy</title>
<link rel="stylesheet" href="ops.css?v=250"><link rel="stylesheet" href="bilingual.css?v=250">
</head>
<body>
<header class="ops-top">
  <a class="ops-brand" href="index.html">JBE <b>Academy</b></a>
  <div class="ops-actions">
    <a class="ops-btn light" href="portal.html">Portal</a>
    <button class="jbe-language-switch" data-lang-switch type="button">English</button>
    <button class="ops-btn light" onclick="JBE.logout()">Sign out</button>
  </div>
</header>
<main class="ops-shell">
<section class="ops-hero"><span class="ops-eyebrow">STUDENT AFFAIRS</span><h1>Student Affairs Dashboard</h1><p>Manage student records, guardians, enrollment quality and group readiness.</p></section>

<section class="ops-grid">
 <article class="ops-card ops-stat"><span>Active students</span><strong id="sActive">—</strong></article>
 <article class="ops-card ops-stat ops-kpi-warn"><span>Students missing guardian</span><strong id="sGuardian">—</strong></article>
 <article class="ops-card ops-stat ops-kpi-warn"><span>Active enrollments without group</span><strong id="sGroup">—</strong></article>
 <article class="ops-card ops-stat"><span>Pending enrollments</span><strong id="sPending">—</strong></article>
</section>
<section class="ops-panel"><h2>Needs Attention</h2><div id="issueList" class="ops-list"></div></section>
<section class="ops-panel"><h2>Enrollment without group</h2><div id="unassignedList" class="ops-list"></div></section>
<section class="ops-panel"><div class="ops-panel-head"><h2>Students</h2><input id="studentSearch" placeholder="Search by name or code" style="max-width:300px"></div><div id="studentList" class="ops-list"></div></section>

<p id="pageMsg"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=250"></script><script src="supabase-config.js?v=250"></script><script src="portal.js?v=250"></script>
<script src="student-affairs.js?v=250"></script>
</body></html>
