<!doctype html><html lang="en" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Setup | JBE Academy</title>
<link rel="stylesheet" href="ops.css?v=250"><link rel="stylesheet" href="bilingual.css?v=250"></head><body>
<header class="ops-top"><a class="ops-brand" href="index.html">JBE <b>Academy</b></a><div class="ops-actions"><button class="jbe-language-switch" data-lang-switch type="button">English</button></div></header>
<main class="ops-shell"><section class="ops-hero"><span class="ops-eyebrow">TEAM INVITATION</span><h1>Set up your staff account</h1><p>Use the email selected by the JBE Academy owner.</p></section>
<section class="ops-panel">
 <h2>Set up your staff account</h2>
 <div id="inviteInfo" class="ops-list"></div>
 <form id="signupForm">
  <label>Email<input id="setupEmail" type="email" readonly></label>
  <div class="ops-form-grid"><label>New password<input id="setupPassword" type="password" minlength="8" required></label><label>Confirm password<input id="setupConfirm" type="password" minlength="8" required></label></div>
  <button class="ops-btn gold" type="submit">Create Account</button>
 </form>
 <hr style="border:0;border-top:1px solid #e3e8ef;margin:20px 0">
 <form id="signinClaimForm">
  <p class="ops-muted">Already have an account? Sign in and claim invite</p>
  <label>Password<input id="claimPassword" type="password"></label>
  <button class="ops-btn" type="submit">Sign in</button>
 </form>
 <p id="setupMsg"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="i18n.js?v=250"></script><script src="supabase-config.js?v=250"></script><script src="staff-setup.js?v=250"></script></body></html>
