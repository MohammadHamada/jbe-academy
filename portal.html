<!DOCTYPE html>

<html dir="ltr" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Portal | JBE Academy</title>
<link href="portal.css" rel="stylesheet"/>
<link href="bilingual.css?v=241" rel="stylesheet"/></head>
<body>
<header class="portal-top">
<a class="brand" href="index.html">JBE <b>Academy</b></a>
<button onclick="JBE.logout()">Sign out</button>
<button class="jbe-language-switch" data-lang-switch="" type="button">English</button></header>
<main class="wrap">
<section class="hero-card">
<span class="eyebrow">JBE ACADEMY</span>
<h1>Your workspace</h1>
<p id="who">Checking your account...</p>
</section>
<div class="cards" id="links"></div>
<p id="portalMessage"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=241"></script><script src="supabase-config.js?v=241"></script>
<script src="portal.js?v=241"></script>
<script>
(async () => {
  const role = await JBE.resolveRole();

  if (!role) return;

  const links = document.getElementById("links");
  const who = document.getElementById("who");
  const message = document.getElementById("portalMessage");

  if (!role.destination) {
    who.textContent = "Account not linked";
    message.textContent =
      "Your Auth account is valid but has not yet been linked to a JBE role.";
    return;
  }

  who.textContent = `Account type: ${role.role}`;

  let items = [];

  if (["super_admin", "admin"].includes(role.role)) {
    items = [
      ["Admin Dashboard", "admin-dashboard.html", "Students, billing and administration"],
      ["Admissions & Sales", "admissions-dashboard.html", "Applications and follow-up"],
      ["Teacher Workspace", "teacher-dashboard.html", "Academic daily work"],
      ["Teaching Profile", "teacher-settings.html", "Systems, grades, subjects and offerings"]
    ];
  } else if (role.role === "teacher") {
    items = [
      ["Teacher Workspace", "teacher-dashboard.html", "Sessions, attendance and learning"],
      ["Teaching Profile", "teacher-settings.html", "Systems, grades, subjects and offerings"]
    ];
  } else if (role.role === "sales") {
    items = [
      ["Admissions & Sales", "admissions-dashboard.html", "Applications and follow-up"]
    ];
  } else if (role.role === "student") {
    items = [
      ["Student Portal", "student-dashboard.html", "Lessons, progress, goals and reports"]
    ];
  } else if (role.role === "parent") {
    items = [
      ["Parent Portal", "parent-dashboard.html", "Progress, attendance, reports and payments"]
    ];
  }

  links.innerHTML = items.map(item => `
    <a class="card" href="${item[1]}">
      <h2>${item[0]}</h2>
      <p class="muted">${item[2]}</p>
    </a>
  `).join("");
})();
</script>
</body>
</html>
