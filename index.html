<!-- Smart Finder Section for index.html -->
<section class="container">
    <div class="smart-finder-wrapper">
        <h2 style="color: var(--primary); margin-bottom: 0.5rem;">الرياضيات بالعربي أو Math بالإنجليزية</h2>
        <p>باقي المواد محفوظة في المنصة ولكنها غير ظاهرة للعامة في مرحلة الإطلاق.</p>
        
        <div class="smart-finder-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">نظام التعليم</label>
                <select id="sf-system" class="form-control">
                    <option value="">اختر النظام...</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">المسار</label>
                <select id="sf-pathway" class="form-control" disabled>
                    <option value="">اختر المسار...</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">المرحلة</label>
                <select id="sf-stage" class="form-control" disabled>
                    <option value="">اختر المرحلة...</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">الصف</label>
                <select id="sf-grade" class="form-control" disabled>
                    <option value="">اختر الصف...</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">لغة Math</label>
                <select id="sf-subject" class="form-control" disabled>
                    <option value="">اختر اللغة...</option>
                </select>
            </div>

            <div style="margin-bottom: 0;">
                <button id="sf-btn" class="btn btn-primary" style="width: 100%; height: 48px;" disabled>عرض الخيارات</button>
            </div>
        </div>
    </div>
</section>
