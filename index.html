<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBE Academy | أكاديمية الرياضيات</title>
    
    <!-- ملفات التصميم -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="bilingual.css">

    <!-- استدعاء Supabase الأساسي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- القائمة العلوية (Navbar) -->
    <header style="background-color: var(--primary); padding: 1rem 0; box-shadow: var(--shadow-sm);">
        <div class="container flex-row" style="justify-content: space-between; align-items: center;">
            <a href="index.html">
                <h2 style="color: white; margin: 0;">JBE Academy</h2>
            </a>
            <nav class="flex-row gap-md only-rtl" style="align-items: center;">
                <a href="index.html" style="color: white; font-weight: 600;">الرئيسية</a>
                <a href="courses.html" style="color: white; font-weight: 600;">البرامج</a>
                <a href="teachers.html" style="color: white; font-weight: 600;">المعلمون</a>
                <a href="portal-v29.html" class="btn" style="background-color: var(--accent); color: white; margin-right: 1rem;">دخول المنصة</a>
            </nav>
        </div>
    </header>

    <!-- محرك البحث المتدرج (Smart Finder) -->
    <main style="min-height: 70vh; padding-top: 3rem;">
        <section class="container">
            <div class="smart-finder-wrapper">
                <h2 style="color: var(--primary); margin-bottom: 0.5rem;">الرياضيات بالعربي أو Math بالإنجليزية</h2>
                <p>باقي المواد محفوظة في المنصة ولكنها غير ظاهرة للعامة في مرحلة الإطلاق.</p>
                
                <div class="smart-finder-grid">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">نظام التعليم</label>
                        <select id="sf-system" class="form-control">
                            <option value="">اختر النظام...</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">المسار</label>
                        <select id="sf-pathway" class="form-control" disabled>
                            <option value="">اختر المسار...</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">المرحلة</label>
                        <select id="sf-stage" class="form-control" disabled>
                            <option value="">اختر المرحلة...</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">الصف</label>
                        <select id="sf-grade" class="form-control" disabled>
                            <option value="">اختر الصف...</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">لغة Math</label>
                        <select id="sf-subject" class="form-control" disabled>
                            <option value="">اختر اللغة...</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 0;">
                        <button id="sf-btn" class="btn btn-primary" style="width: 100%; height: 48px;" disabled>عرض الخيارات</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- التذييل (Footer) -->
    <footer style="background-color: var(--text-main); color: white; padding: 2rem 0; text-align: center;">
        <div class="container">
            <p style="margin: 0; color: var(--border-light);">© 2026 JBE Academy - The right Math teacher, clear learning plan.</p>
        </div>
    </footer>

    <!-- ملفات الجافاسكريبت (ترتيب صارم) -->
    <script src="supabase-config.js"></script>
    <script src="home-v29.js"></script>
</body>
</html>
