<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academic Catalog | JBE Academy</title>
<link rel="stylesheet" href="ops.css?v=280">
<link rel="stylesheet" href="bilingual.css?v=280">
<link rel="stylesheet" href="academic-catalog.css?v=280">
</head>
<body>
<header class="ops-top">
  <a class="ops-brand" href="owner-dashboard.html">JBE <b>Academy</b></a>
  <div class="ops-actions">
    <a class="ops-btn light" href="owner-dashboard.html">Owner</a>
    <a class="ops-btn light" href="teacher-manage.html">Teacher Management</a>
    <button class="jbe-language-switch" data-lang-switch type="button">English</button>
  </div>
</header>
<main class="ops-shell">
<section class="ops-hero">
  <span class="ops-eyebrow">ACADEMIC CONTROL</span>
  <h1>إدارة الكتالوج الأكاديمي</h1>
  <p>حدد المواد التي تظهر للزائر لكل منهج وصف، وما الذي يظهر كمادة مميزة في الصفحة الرئيسية.</p>
</section>
<section class="ops-panel">
  <div class="ac-toolbar">
    <select id="acSystem"></select>
    <select id="acPathway"></select>
    <select id="acGrade"></select>
    <input id="acSearch" placeholder="Search subject">
  </div>
  <div class="ac-note"><strong>مهم:</strong> وجود المادة في الكتالوج لا يعني ظهورها للعامة. أنت تتحكم في Public وFeatured لكل صف.</div>
  <div id="acList" class="ac-list"></div>
  <p id="acMsg"></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=280"></script>
<script src="supabase-config.js?v=280"></script>
<script src="portal.js?v=280"></script>
<script src="academic-catalog.js?v=280"></script>
</body>
</html>
