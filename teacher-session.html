<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Session | JBE Academy</title>
<link rel="stylesheet" href="ops.css?v=250"><link rel="stylesheet" href="bilingual.css?v=250">
</head>
<body>
<header class="ops-top">
  <a class="ops-brand" href="index.html">JBE <b>Academy</b></a>
  <div class="ops-actions">
    <a class="ops-btn light" href="portal.html">Portal</a>
    <button class="jbe-language-switch" data-lang-switch type="button">English</button>
    <button class="ops-btn light" onclick="JBE.logout()">Sign out</button>
  </div>
</header>
<main class="ops-shell">
<section class="ops-hero"><span class="ops-eyebrow">TEACHER SESSION</span><h1>Teacher Session</h1><p>Attendance, homework and session completion in one place.</p></section>

<section class="ops-panel"><div id="sessionSummary"></div><div class="ops-actions"><button id="startBtn" class="ops-btn gold">Start Session</button><button id="endBtn" class="ops-btn danger">End Session</button></div><p id="sessionMsg"></p></section>
<section class="ops-panel"><h2>Session Roster</h2><div id="roster" class="ops-list"></div></section>
<section class="ops-panel"><h2>Homework for this session</h2><form id="homeworkForm"><div class="ops-form-grid"><label>Homework title<input id="hwTitle" required></label><label>Due date<input id="hwDue" type="datetime-local"></label></div><label>Description<textarea id="hwDesc"></textarea></label><label>Resource URL<input id="hwUrl" type="url"></label><button class="ops-btn gold" type="submit">Publish Homework</button><p id="hwMsg"></p></form><div id="activities" class="ops-list"></div></section>

<p id="pageMsg"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js?v=250"></script><script src="supabase-config.js?v=250"></script><script src="portal.js?v=250"></script>
<script src="teacher-session.js?v=250"></script>
</body></html>
